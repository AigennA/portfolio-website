# Automatic quality checks: runs on every pull request and on every change to main.
# The result shows as a green check or red X on the pull request.
# What is checked: see tests/quality.mjs.
name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test tools
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run quality checks
        run: npm test
